{% extends "base.html" %}

{% block title %}Check Medicine - Counterfeit Medicine Detection{% endblock %}

{% block content %}
<div class="container">
    <h1>Check Medicine</h1>
    <p>Fill in the details below to check if a medicine might be counterfeit.</p>

    <div class="card">
        <form action="/predict" method="POST">

            <div class="form-row">
                <div class="form-group">
                    <label for="medicine_name">Medicine Name</label>
                    <select id="medicine_name" name="medicine_name" required>
                        <option value="">-- Select --</option>
                        {% for drug in drugs %}
                        <option value="{{ drug }}">{{ drug }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="manufacturer">Manufacturer</label>
                    <select id="manufacturer" name="manufacturer" required>
                        <option value="">-- Select --</option>
                        {% for m in manufacturers %}
                        <option value="{{ m }}">{{ m }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="batch_number">Batch Number</label>
                    <input type="text" id="batch_number" name="batch_number"
                           placeholder="e.g. B12345" required>
                </div>
                <div class="form-group">
                    <label for="country">Country</label>
                    <select id="country" name="country" required>
                        <option value="">-- Select --</option>
                        {% for c in countries %}
                        <option value="{{ c }}">{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="manufacture_date">Manufacture Date</label>
                    <input type="date" id="manufacture_date" name="manufacture_date" required>
                </div>
                <div class="form-group">
                    <label for="expiry_date">Expiry Date</label>
                    <input type="date" id="expiry_date" name="expiry_date" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="dosage">Dosage (mg)</label>
                    <input type="number" id="dosage" name="dosage"
                           placeholder="e.g. 500" min="1" required>
                </div>
                <div class="form-group">
                    <label for="price">Price (&#8377;)</label>
                    <input type="number" id="price" name="price"
                           placeholder="e.g. 150" step="0.01" min="0.01" required>
                </div>
            </div>

            <button type="submit" class="btn">Check Risk</button>
        </form>
    </div>
</div>
{% endblock %}
